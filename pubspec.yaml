name: la_caja_del_bromista
description: "MVP de La Caja del Bromista - App de bromas ultra-rápida."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  audioplayers: ^5.2.1
  sensors_plus: ^5.0.1
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.2.1
  record: ^6.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^12.0.1
  video_player: ^2.11.1
  url_launcher: ^6.2.4
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Caja_roja_normal.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/videos/
    - assets/videos/trampas/chicas/
    - assets/videos/trampas/chicos/
    - assets/images/trampas/
    - assets/images/trampas/chicas/
    - assets/images/trampas/chicos/
    - assets/sounds/trampas/
    - assets/sounds/trampas/chicas/
    - assets/sounds/trampas/chicos/
